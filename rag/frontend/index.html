<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FOMO Support Assistant</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="logo-dot"></div>
      <div>
        <h1>FOMO Support Assistant</h1>
        <p>Answers are grounded in the FOMO knowledge base — 84 articles, cited by KB-ID.</p>
      </div>
    </header>

    <main id="chat" class="chat" aria-live="polite">
      <div class="message assistant">
        <div class="bubble">
          Hi! Ask me anything about FOMO — sign-in, posts, messaging, notifications, accounts — and
          I'll answer from the support knowledge base.
        </div>
      </div>
    </main>

    <form id="ask-form" class="composer">
      <input
        id="question-input"
        type="text"
        placeholder="Ask a question, e.g. Why did I get signed out?"
        autocomplete="off"
        required
      />
      <button id="send-btn" type="submit">Send</button>
    </form>

    <p id="error-banner" class="error-banner hidden"></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
